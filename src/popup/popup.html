<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Intelligence</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="../../assets/icons/brand-icon.png" alt="" width="28" height="28" />
          <span class="brand-name">Website Intelligence</span>
        </div>
        <div class="top-actions">
          <button type="button" id="refresh-btn" class="icon-btn" title="Analyze / refresh" aria-label="Analyze">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3.1L6.7 16.5A7 7 0 0 0 19 12c0-1.93-.78-3.68-2.05-4.95zM6 12c0-1.1.3-2.13.81-3.04L5.34 7.5A6.97 6.97 0 0 0 5 12c0 3.53 2.61 6.43 6 6.92V21l5-5-5-5v3c-2.76 0-5-2.24-5-5z"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="site-card" aria-label="Current website">
        <div class="site-card-main">
          <div class="detect-icon-wrap" title="Total detections">
            <img class="detect-icon" src="../../assets/icons/brand-icon.png" alt="" width="40" height="40" />
            <span id="detect-badge" class="detect-badge">0</span>
          </div>
          <div class="site-meta">
            <div id="domain" class="site-domain">—</div>
            <div id="site-sub" class="site-sub">Ready to analyze</div>
          </div>
        </div>
        <div id="site-avatar" class="site-avatar" aria-hidden="true">W</div>
      </section>

      <div id="blocked-banner" class="banner" hidden></div>

      <nav id="tabs" class="tabs" aria-label="Sections">
        <button type="button" class="tab is-active" data-tab="technologies">Technologies</button>
        <button type="button" class="tab" data-tab="site">Site</button>
        <button type="button" class="tab" data-tab="security">Security</button>
      </nav>

      <main class="content">
        <section id="panel-technologies" class="tab-panel is-active" data-panel="technologies">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input id="tech-search" class="search-input" type="search" placeholder="Search..." autocomplete="off" />
          </div>
          <div id="wp-overview" class="wp-overview" hidden></div>
          <div id="tech-grid" class="tech-grid"></div>
          <p id="tech-empty" class="empty-state" hidden>No technologies detected yet. Click refresh to analyze.</p>
        </section>

        <section id="panel-site" class="tab-panel" data-panel="site" hidden>
          <p id="site-blurb" class="site-blurb"></p>

          <div class="info-table" id="general-info"></div>

          <h3 class="section-label">Page statistics</h3>
          <div id="stats-grid" class="stats-grid"></div>

          <h3 class="section-label">SEO &amp; standards</h3>
          <div id="seo-list" class="check-list"></div>

          <h3 class="section-label">Performance</h3>
          <div id="perf-list" class="check-list"></div>
        </section>

        <section id="panel-security" class="tab-panel" data-panel="security" hidden>
          <div id="security-list" class="check-list security-list"></div>
        </section>
      </main>

      <footer class="footer">
        <a
          class="brand-bar"
          href="https://jnova.tech"
          target="_blank"
          rel="noopener noreferrer"
          title="JNova.Tech"
        >
          <img
            class="brand-bar-logo"
            src="../../assets/icons/jnova-tech.png"
            alt="JNova.Tech"
            width="88"
            height="22"
          />
          <span class="brand-bar-meta">
            <span class="brand-bar-link">jnova.tech</span>
            <span class="brand-bar-dot" aria-hidden="true">·</span>
            <span id="ext-version" class="brand-bar-version">v0.8.0</span>
          </span>
        </a>
        <div class="footer-actions">
          <button type="button" id="export-json" class="export-btn" disabled>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h5.66V9h3.84L12 2z"/></svg>
            JSON
          </button>
          <button type="button" id="export-csv" class="export-btn" disabled>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h5.66V9h3.84L12 2z"/></svg>
            CSV
          </button>
        </div>
      </footer>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
